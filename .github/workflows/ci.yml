name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole job takes about 15 minutes (the browser tests are about 10 of them) and grows with every feature, so 15 cancelled
    # healthy runs (Oct 31). Thirty leaves room; a run that hangs is still stopped.
    timeout-minutes: 30
    # A free, throwaway Postgres for the member system's database tests. It lives only for this run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (including the database tests)
        run: npm test
        env:
          CLUB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (in memory, and against Postgres)
        run: npm run test:e2e
        env:
          CLUB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Keep the report if a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
